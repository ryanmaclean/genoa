name: FreeBSD Integration Tests

on:
  push:
    branches: [main]
    paths:
      - 'profiles/**'
      - 'genoa.nu'
      - 'adapters/**'
      - 'test/**'

jobs:
  smoke-tests:
    runs-on: [self-hosted, freebsd]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke tests
        run: nu test/smoke.nu

      - name: Validate all example manifests
        run: |
          failed=0
          for f in examples/*.toml; do
            echo "Validating $f..."
            nu genoa.nu validate "$f" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          errs = d.get('errors', [])
          warns = d.get('warnings', [])
          print('  valid:', d.get('valid'))
          for e in errs: print('  ERROR:', e)
          for w in warns: print('  warn:', w)
          sys.exit(0 if d.get('valid') else 1)
            " || failed=1
          done
          exit $failed

      - name: Post results to summary
        if: always()
        run: |
          echo "## Integration Test Results" >> $GITHUB_STEP_SUMMARY
          nu test/smoke.nu 2>&1 | grep "Results:" >> $GITHUB_STEP_SUMMARY || true
