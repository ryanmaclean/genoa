name: Validate Example Manifests

on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - 'schema/**'
      - 'genoa.nu'
  pull_request:
    branches: ['**']
    paths:
      - 'examples/**'
      - 'schema/**'
      - 'genoa.nu'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Nushell binary
        id: cache-nu
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/nu
          key: nu-0.101.0-linux-x86_64

      - name: Install Nushell
        if: steps.cache-nu.outputs.cache-hit != 'true'
        run: |
          NU_VERSION="0.101.0"
          curl -fsSL "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/nu-${NU_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin \
                nu-${NU_VERSION}-x86_64-unknown-linux-gnu/nu
          nu --version

      - name: Validate all example manifests
        run: |
          failed=0
          for f in examples/*.toml; do
            echo "Validating $f..."
            nu genoa.nu validate "$f" > /tmp/result.json
            if python3 -c "
          import json, sys
          d = json.load(open('/tmp/result.json'))
          errs = d.get('errors', [])
          warns = d.get('warnings', [])
          print('  valid:', d.get('valid'))
          for e in errs: print('  ERROR:', e)
          for w in warns: print('  warn:', w)
          sys.exit(0 if d.get('valid') else 1)
          "; then
              echo "  PASS: $f"
            else
              echo "  FAIL: $f"
              failed=1
            fi
          done
          exit $failed

      - name: Validate schema file
        run: |
          python3 -c "import json; json.load(open('schema/manifest.v1.json')); print('schema/manifest.v1.json: valid JSON')"

      - name: Report manifest count
        if: always()
        run: |
          count=$(ls examples/*.toml 2>/dev/null | wc -l | tr -d ' ')
          echo "## Manifest Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "Validated ${count} manifest(s) in \`examples/\`" >> $GITHUB_STEP_SUMMARY
