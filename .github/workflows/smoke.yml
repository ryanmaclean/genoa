name: Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Nushell binary
        id: cache-nu
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/nu
          key: nu-0.111.0-linux-x86_64

      - name: Install Nushell
        if: steps.cache-nu.outputs.cache-hit != 'true'
        run: |
          NU_VERSION="0.111.0"
          curl -fsSL "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/nu-${NU_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin \
                nu-${NU_VERSION}-x86_64-unknown-linux-musl/nu
          nu --version

      - name: Run smoke tests
        run: nu test/smoke.nu

      - name: Post summary
        if: always()
        run: |
          echo "## Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          nu test/smoke.nu 2>&1 | grep "Results:" >> $GITHUB_STEP_SUMMARY || echo "Tests did not complete" >> $GITHUB_STEP_SUMMARY
