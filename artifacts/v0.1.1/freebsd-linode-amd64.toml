schema_version = "v1"
profile = "kboot"

[image]
name = "smolbsd-linode-amd64"
version = "v0.1.0"
format = "raw"
size_mb = 2048
description = "Minimal FreeBSD for Linode amd64 via rescue-dd"

[target]
os = "freebsd"
os_version = "15.0-RELEASE"
arch = "amd64"
platform = "generic"

[kernel]
config = "GENERIC"
strip_debug = true

[packages]
include = [
  "FreeBSD-runtime",
  "FreeBSD-clibs",
  "FreeBSD-rc",
  "FreeBSD-utilities",
  "FreeBSD-pkg-bootstrap"
]

[agent]
name = "ii-agent"
version = "v0.1.0"

[agent.source]
type = "url"
url = "https://gitea.local:3000/ii/ii-agent/releases/download/v0.1.0-freebsd-amd64/ii-agent"
sha256 = "1111111111111111111111111111111111111111111111111111111111111111"

[agent.rc_service]
enabled = true
name = "ii_agent"

[network]
interface = "vtnet0"
mode = "dhcp"
hostname = "smolbsd-linode"
# Replace with your SSH public key from: cat ~/.ssh/id_ed25519.pub
ssh_keys = ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAEXAMPLEKEYREPLACEWITHYOUROWN user@host"]


[deploy]
provider = "linode_akamai"

[metadata]
builder_notes = "Raw format for Linode rescue-dd deployment"
target_region = "global"
