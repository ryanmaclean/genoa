schema_version = "v1"
profile = "uefi"

[image]
name = "smolbsd-vultr-amd64"
version = "v0.1.3"
format = "raw"
size_mb = 2048
output_dir = "./out"
description = "Minimal FreeBSD 15 UEFI for Vultr amd64 - boot fix release"

[target]
os = "freebsd"
os_version = "15.0-RELEASE"
arch = "amd64"
platform = "generic"

[kernel]
config = "GENERIC"
strip_debug = true

[agent]
name = "ii-agent"
version = "v0.1.3"

[agent.source]
type = "local_path"
path = "/root/genoa/out/ii-agent"

[agent.rc_service]
enabled = true
name = "ii_agent"

[network]
interface = "vtnet0"
mode = "dhcp"
hostname = "smolbsd-v013"
ssh_keys = []

[deploy]
provider = "vultr"
region = "lax"

[metadata]
builder_notes = "v0.1.3: critical fix - loader.conf and rc.conf now written to image disk"
